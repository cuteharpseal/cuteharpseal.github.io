<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f8f7">
  <title>Portfolio</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Mono:wght@400&display=swap');

    :root {
      --bg: #f7f7f5;
      --text: #111;
      --muted: #8a8a86;
      --subtle: #b4b4ae;
      --card: rgba(255,255,255,.72);
      --border: rgba(0,0,0,.07);
      --btn: rgba(0,0,0,.055);
      --btn-hover: rgba(0,0,0,.095);
      --shadow: 0 24px 70px rgba(0,0,0,.08);
    }

    [data-theme="dark"] {
      --bg: #111110;
      --text: #f1f1ee;
      --muted: #858580;
      --subtle: #5f5f5a;
      --card: rgba(30,30,29,.72);
      --border: rgba(255,255,255,.08);
      --btn: rgba(255,255,255,.07);
      --btn-hover: rgba(255,255,255,.12);
      --shadow: 0 24px 70px rgba(0,0,0,.28);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      min-height: 100%;
      background: var(--bg);
      transition: background .55s ease;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 72px 24px 40px;
      overflow-x: hidden;
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,.9), transparent 36rem),
        var(--bg);
      transition: color .55s ease, background .55s ease;
    }

    [data-theme="dark"] body {
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,.025), transparent 36rem),
        var(--bg);
    }

    .theme-btn {
      position: fixed;
      z-index: 10;
      top: 18px;
      right: 18px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      background: var(--btn);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,.05);
      transition: background .35s ease, border-color .35s ease, transform .2s ease;
    }

    .theme-btn:hover { background: var(--btn-hover); transform: translateY(-1px); }
    .theme-btn:active { transform: scale(.93); }
    .theme-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .stage {
      width: min(100%, 380px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .datetime {
      margin-bottom: 28px;
      color: var(--muted);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .7s ease, transform .7s ease, color .55s ease;
    }

    .datetime.in { opacity: 1; transform: translateY(0); }

    .time {
      font-family: "Space Mono", monospace;
      font-size: clamp(22px, 6vw, 28px);
      line-height: 1;
      letter-spacing: -.04em;
      color: var(--text);
      transition: color .55s ease;
    }

    .date {
      margin-top: 8px;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .avatar-wrap,
    .name,
    .bio,
    .gh-link {
      opacity: 0;
    }

    .avatar-wrap {
      transform: translateY(20px) scale(.88);
      transition: opacity .65s ease, transform .7s cubic-bezier(.34,1.35,.64,1);
    }

    .avatar-wrap.in { opacity: 1; transform: translateY(0) scale(1); }

    .avatar {
      width: 148px;
      height: 148px;
      display: block;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid var(--card);
      background: var(--card);
      box-shadow: var(--shadow);
      transition: border-color .55s ease, box-shadow .55s ease;
    }

    .gh-link {
      display: grid;
      place-items: center;
      margin-top: 15px;
      line-height: 0;
      color: var(--text);
      transform: translateY(10px) scale(.9);
      transition: opacity .45s ease .12s, transform .55s cubic-bezier(.34,1.45,.64,1) .12s, color .55s ease;
    }

    .gh-link.in { opacity: 1; transform: translateY(0) scale(1); }

    .gh-link svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
      transition: transform .25s cubic-bezier(.34,1.5,.64,1), opacity .25s ease;
    }

    .gh-link:hover svg { transform: translateY(-2px) scale(1.12); opacity: .58; }
    .gh-link:active svg { transform: scale(.94); }

    .name {
      margin-top: 20px;
      font-size: 27px;
      line-height: 1.15;
      font-weight: 600;
      letter-spacing: -.045em;
      transform: translateY(10px);
      transition: opacity .5s ease .2s, transform .5s ease .2s, color .55s ease;
    }

    .name.in { opacity: 1; transform: translateY(0); }

    .bio {
      max-width: 310px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      transform: translateY(8px);
      transition: opacity .5s ease .28s, transform .5s ease .28s, color .55s ease;
    }

    .bio.in { opacity: 1; transform: translateY(0); }

    @media (max-width: 480px) {
      body { padding-top: 66px; }
      .theme-btn { top: 14px; right: 14px; }
      .datetime { margin-bottom: 24px; }
      .avatar { width: 136px; height: 136px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <button class="theme-btn" id="themeBtn" type="button" aria-label="switch to dark mode" title="switch theme">
    <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
  </button>

  <main class="stage">
    <div class="datetime" id="datetime" aria-live="polite">
      <div class="time" id="time">--:--</div>
      <div class="date" id="date">loading date</div>
    </div>

    <div class="avatar-wrap" id="avatarWrap">
      <img class="avatar" id="avatar" src="" alt="profile picture">
    </div>

    <a class="gh-link" id="ghLink" href="#" target="_blank" rel="noopener noreferrer" aria-label="open GitHub profile">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
      </svg>
    </a>

    <p class="name" id="name"></p>
    <p class="bio" id="bio"></p>
  </main>

<script>
  const USERNAME = 'cuteharpseal';
  const html = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  const themeIcon = document.getElementById('themeIcon');

  const moon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  const sun = '<circle cx="12" cy="12" r="4.5"/><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.55" y1="4.55" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.45" y2="19.45"/><line x1="17.7" y1="6.3" x2="19.45" y2="4.55"/><line x1="4.55" y1="19.45" x2="6.3" y2="17.7"/>';

  function applyTheme(theme) {
    html.setAttribute('data-theme', theme);
    themeIcon.innerHTML = theme === 'dark' ? sun : moon;
    themeBtn.setAttribute('aria-label', theme === 'dark' ? 'switch to light mode' : 'switch to dark mode');
    themeBtn.title = theme === 'dark' ? 'switch to light mode' : 'switch to dark mode';
    document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#111110' : '#f7f7f5');
  }

  const savedTheme = localStorage.getItem('portfolio-theme');
  applyTheme(savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

  themeBtn.addEventListener('click', () => {
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    localStorage.setItem('portfolio-theme', next);
  });

  function updateDateTime() {
    const now = new Date();
    document.getElementById('time').textContent = new Intl.DateTimeFormat(undefined, {
      hour: '2-digit',
      minute: '2-digit'
    }).format(now);

    document.getElementById('date').textContent = new Intl.DateTimeFormat(undefined, {
      weekday: 'long',
      day: 'numeric',
      month: 'long'
    }).format(now);
  }

  async function init() {
    updateDateTime();
    setInterval(updateDateTime, 1000);

    document.getElementById('datetime').classList.add('in');

    try {
      const res = await fetch(`https://api.github.com/users/${USERNAME}`);
      if (!res.ok) throw new Error(`GitHub returned ${res.status}`);
      const d = await res.json();

      document.getElementById('avatar').src = d.avatar_url;
      document.getElementById('avatar').alt = `${d.name || d.login}'s profile picture`;
      document.getElementById('name').textContent = d.name || d.login;
      document.getElementById('bio').textContent = d.bio || '';
      document.getElementById('ghLink').href = `https://github.com/${d.login}`;

      requestAnimationFrame(() => requestAnimationFrame(() => {
        document.getElementById('avatarWrap').classList.add('in');
        document.getElementById('ghLink').classList.add('in');
        document.getElementById('name').classList.add('in');
        document.getElementById('bio').classList.add('in');
      }));
    } catch (error) {
      console.error('Could not load GitHub profile:', error);
      document.getElementById('name').textContent = USERNAME;
      document.getElementById('ghLink').href = `https://github.com/${USERNAME}`;

      requestAnimationFrame(() => {
        document.getElementById('name').classList.add('in');
        document.getElementById('ghLink').classList.add('in');
      });
    }
  }

  init();
</script>
</body>
</html>
